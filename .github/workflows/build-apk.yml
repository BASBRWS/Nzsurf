name: Build Android APK

# Bouwt de NzSurf-webapp, verpakt hem met Capacitor tot een Android-APK en
# publiceert het resultaat als release `latest-build`. Draait bij elke push
# naar de ontwikkelbranch of main, en handmatig via "Run workflow".

on:
  push:
    branches:
      - main
      - claude/nzsurf-apk-screenshot-krz2px
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        # Geen --frozen-lockfile: een AI Studio-export past bun.lock vaak aan,
        # en dan mag de install de lockfile bijwerken i.p.v. te falen.
        run: bun install

      - name: Bepaal versie
        id: version
        run: |
          VN=$(node -p "require('./package.json').version")
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Versie $VN (build ${{ github.run_number }})"

      - name: Build web assets
        run: bunx vite build
        env:
          # Optioneel: zet dit als repository-variabele naar de URL van de
          # gedeployde Express-backend om de AI-features in de APK te activeren.
          # Leeg = de app gebruikt de offline adviesmotor.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Add Android platform
        # Het native android/-project staat niet in git; Capacitor genereert het
        # hier deterministisch op basis van capacitor.config.ts en de gepinde
        # @capacitor/android-versie. Al aanwezig? Dan is add een no-op.
        run: bunx cap add android || true

      - name: Capacitor sync (Android)
        run: bunx cap sync android

      - name: Generate app icons & splash
        # Bakt het NZ-logo (assets/) als launcher-icoon en splashscherm in het
        # gegenereerde android/-project.
        run: bunx capacitor-assets generate --android

      - name: Zet versienummer in Android-build
        # android/ is in CI geregenereerd, dus we patchen versionName/versionCode
        # hier: versionName uit package.json, versionCode = buildnummer (oplopend).
        run: |
          sed -i "s/versionCode 1/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nzsurf-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzsurf-apk-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: nzsurf-latest.apk

      - name: Publish to latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: NzSurf v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})
          body: |
            Automatische debug-build van de NzSurf Android-app.

            **Versie:** ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})
            Commit: ${{ github.sha }}
          files: nzsurf-latest.apk
