name: Build Android APK

# Bouwt de NzSurf-webapp, verpakt hem met Capacitor tot een Android-APK en
# publiceert het resultaat als release `latest-build`. Draait bij elke push
# naar de ontwikkelbranch of main, en handmatig via "Run workflow".

on:
  push:
    branches:
      - main
      - claude/nzsurf-apk-screenshot-krz2px
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bunx vite build
        env:
          # Optioneel: zet dit als repository-variabele naar de URL van de
          # gedeployde Express-backend om de AI-features in de APK te activeren.
          # Leeg = de app gebruikt de offline adviesmotor.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Add Android platform
        # Het native android/-project staat niet in git; Capacitor genereert het
        # hier deterministisch op basis van capacitor.config.ts en de gepinde
        # @capacitor/android-versie. Al aanwezig? Dan is add een no-op.
        run: bunx cap add android || true

      - name: Capacitor sync (Android)
        run: bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nzsurf-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nzsurf-apk
          path: nzsurf-latest.apk

      - name: Publish to latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: NzSurf latest build
          body: |
            Automatische debug-build van de NzSurf Android-app.
            Commit: ${{ github.sha }}
          files: nzsurf-latest.apk
