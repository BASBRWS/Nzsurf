name: Voorspellingsaudit (Ouddorp)

# Slaat dagelijks de verwachtingen van NzSurf en andere voorspellers op, plus de
# werkelijke metingen van Rijkswaterstaat. De Beta-pagina in de app vergelijkt ze.
# 05:30 UTC ≈ 07:30 NL-tijd.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen testen (niets opslaan)"
        type: boolean
        default: false
  # Tijdelijk: testen vanaf de ontwikkelbranch (altijd dry run).
  push:
    branches: [claude/nzsurf-apk-screenshot-krz2px]
    paths:
      - scripts/forecast-audit.ts
      - .github/workflows/forecast-audit.yml

concurrency:
  group: forecast-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verzamel verwachtingen en metingen
        run: bun run scripts/forecast-audit.ts
        env:
          # NzSurf-tijden komen als lokale tijd binnen; zo worden ze correct naar UTC omgezet.
          TZ: Europe/Amsterdam
          AUDIT_DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run) && '1' || '0' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
