name: Voorspellingsaudit (Ouddorp)

# Slaat dagelijks de verwachtingen van NzSurf en andere voorspellers op, plus de
# werkelijke metingen van Rijkswaterstaat. De Beta-pagina in de app vergelijkt ze.
# 05:30 UTC ≈ 07:30 NL-tijd. GitHub start geplande runs soms uren te laat of
# slaat ze over; daarom 4x per dag. De eerste run van de dag legt de verwachtingen
# vast, latere runs vullen alleen de metingen aan.

on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen testen (niets opslaan)"
        type: boolean
        default: false
      obs_hours:
        description: "Metingen van de laatste N uur ophalen (standaard 48; max 336 om gaten aan te vullen)"
        required: false
        default: "48"

concurrency:
  group: forecast-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Zonder install-scripts: sharp (beeldbibliotheek) is hier niet nodig en zijn
        # downloadserver gaf een 500, waardoor de hele run mislukte.
        run: bun install --ignore-scripts

      - name: Verzamel verwachtingen en metingen
        run: bun run scripts/forecast-audit.ts
        env:
          # NzSurf-tijden komen als lokale tijd binnen; zo worden ze correct naar UTC omgezet.
          TZ: Europe/Amsterdam
          AUDIT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          AUDIT_OBS_HOURS: ${{ inputs.obs_hours || '48' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
          STORMGLASS_API_KEY: ${{ secrets.STORMGLASS_API_KEY }}
