name: Bodemprofielen (Jarkus)

# Haalt de bodemprofielen (Jarkus, Rijkswaterstaat) bij de auditspots op en zet ze als
# src/data/bathymetry.json in de branch waarop je hem start. Alleen handmatig.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jarkus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakketten
        run: pip install xarray netCDF4 numpy
      - name: Profielen ophalen
        run: python scripts/bathymetry/jarkus.py src/data/bathymetry.json
      - name: Vastleggen in de branch
        run: |
          git config user.name "nzsurf-bot"
          git config user.email "nzsurf-bot@users.noreply.github.com"
          git add src/data/bathymetry.json
          git diff --cached --quiet && echo "geen wijziging" || (git commit -m "Bodemprofielen (Jarkus) bijgewerkt" && git push)
